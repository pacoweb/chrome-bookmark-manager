<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h1 id="app-title">📑 Bookmark Manager</h1>
      <span id="app-version" class="app-version"></span>
    </div>

    <!-- Language Selector -->
    <div class="language-selector">
      <select id="language-select">
        <option value="es">🇪🇸 Español</option>
        <option value="en">🇬🇧 English</option>
      </select>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="search" data-i18n="tab.search">🔍 Búsqueda</button>
      <button class="tab-btn" data-tab="groups" data-i18n="tab.groups">📁 Grupos</button>
      <button class="tab-btn" data-tab="dead-links" data-i18n="tab.deadLinks">❌ Enlaces Muertos</button>
    </div>

    <!-- Search Tab -->
    <div class="tab-content active" id="search-tab">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar por título o URL...">
      </div>
      <div class="search-controls">
        <span id="search-count" class="search-count"></span>
        <button id="delete-search-btn" class="btn-danger btn-small" style="display: none;">🗑️</button>
      </div>
      <div id="search-results" class="results-list"></div>
    </div>

    <!-- Groups Tab -->
    <div class="tab-content" id="groups-tab">
      <div class="groups-controls">
        <button id="collapse-all-btn" class="btn-secondary btn-small" data-i18n="groups.collapseAll">Colapsar todo</button>
        <button id="expand-all-btn" class="btn-secondary btn-small" data-i18n="groups.expandAll">Expandir todo</button>
      </div>
      <div id="groups-container" class="groups-list"></div>
    </div>

    <!-- Dead Links Tab -->
    <div class="tab-content" id="dead-links-tab">
      <div class="dead-links-controls">
        <button id="check-links-btn" class="btn-primary" data-i18n="deadLinks.checkBtn">Verificar Enlaces</button>
        <button id="cancel-check-btn" class="btn-secondary" style="display: none;" data-i18n="deadLinks.cancelBtn">Cancelar</button>
        <button id="delete-dead-btn" class="btn-danger" disabled data-i18n="deadLinks.deleteAll">Eliminar Todos los Muertos</button>
      </div>
      <div id="progress-container" class="progress-container" style="display: none;">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text">Verificando...</p>
      </div>
      <div id="dead-links-results" class="results-list"></div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2 data-i18n="modal.editTitle">Editar Marcador</h2>
      <label for="edit-title" data-i18n="modal.editLabelTitle">Título:</label>
      <input type="text" id="edit-title">
      <label for="edit-url" data-i18n="modal.editLabelUrl">URL:</label>
      <input type="text" id="edit-url">
      <div class="modal-actions">
        <button id="save-edit-btn" class="btn-primary" data-i18n="modal.editSave">Guardar</button>
        <button id="cancel-edit-btn" class="btn-secondary" data-i18n="modal.editCancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2 data-i18n="modal.deleteTitle">Confirmar Eliminación</h2>
      <p data-i18n="modal.deleteMessage">¿Estás seguro de que deseas eliminar este marcador?</p>
      <div class="modal-actions">
        <button id="confirm-delete-btn" class="btn-danger" data-i18n="modal.deleteConfirm">Eliminar</button>
        <button id="cancel-delete-btn" class="btn-secondary" data-i18n="modal.deleteCancel">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
