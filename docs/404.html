<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Bookmarks Utilities</title>
  <meta http-equiv="refresh" content="3;url=./index.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8f9fa;
      color: #1a1a2e;
      text-align: center;
      padding: 20px;
    }
    .error { max-width: 400px; }
    .error h1 { font-size: 4rem; margin-bottom: 12px; }
    .error p { font-size: 1.1rem; color: #555; margin-bottom: 20px; }
    .error a {
      display: inline-block;
      background: #1a73e8;
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    .error a:hover { background: #1557b0; }
  </style>
</head>
<body>
  <div class="error">
    <h1>404</h1>
    <p>La página que buscas no existe.<br>Redirigiendo a la página principal...</p>
    <a href="./index.html">Volver al inicio</a>
  </div>
</body>
</html>
